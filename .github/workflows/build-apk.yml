
name: Build BELAJAR MI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare web files
        run: |
          if [ -f index.html ]; then
            cp index.html /tmp/index.html
          elif [ -f Index.html ]; then
            cp Index.html /tmp/index.html
          else
            echo "HTML tidak ditemukan"
            exit 1
          fi

          mkdir -p www/assets
          cp /tmp/index.html www/index.html

          if [ -d assets ]; then
            cp -R assets/. www/assets/
          elif [ -d Assets ]; then
            cp -R Assets/. www/assets/
          fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Create Android project
        run: |
          npx cap init "Belajar MI by Arya" "com.arya.belajarmi" --web-dir www
          npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BELAJAR-MI-by-Arya-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
